<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Páginas do projeto</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
			background: #f4f4f4;
			color: #222;
		}

		main {
			width: min(90%, 520px);
			padding: 2rem;
			text-align: center;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 4px 16px #0002;
		}

		nav {
			display: flex;
			gap: 1rem;
			justify-content: center;
			flex-wrap: wrap;
		}

		.projeto {
			margin-top: 2rem;
		}

		.projeto h2 {
			font-size: 1.2rem;
			margin-bottom: 1rem;
		}

		.separador {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			margin: 1.5rem 0;
			color: #64748b;
		}

		.separador::before,
		.separador::after {
			content: "";
			flex: 1;
			height: 1px;
			background: #cbd5e1;
		}

		a {
			padding: 0.8rem 1.2rem;
			color: #fff;
			background: #2563eb;
			border-radius: 6px;
			text-decoration: none;
		}

		a:hover { background: #1d4ed8; }
	</style>
</head>
<body>
	<main>
		<h1>Bem-vindo</h1>
		<p>Escolha uma das versões abaixo:</p>

		<section class="projeto" aria-labelledby="bootstrap-titulo">
			<h2 id="bootstrap-titulo">Portifólio feito com Bootstrap</h2>
			<nav aria-label="Páginas do projeto Bootstrap">
				<a href="bootstrap/index.html">Acessar portifólio</a>
			</nav>
		</section>

		<div class="separador" role="separator" aria-label="Separação entre os projetos">✦</div>

		<section class="projeto" aria-labelledby="tailwind-titulo">
			<h2 id="tailwind-titulo">Portifólio feito com Tailwind</h2>
			<nav aria-label="Páginas do projeto Tailwind">
				<a href="tailwind/index.html">Acessar portifólio</a>
			</nav>
		</section>
	</main>
</body>
</html>
